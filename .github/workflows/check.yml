name: Check neustroy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node20-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start from Node 20 and check persisted sheets
        run: npx --yes --package=node@20.16.0 node tests/local-runtime-smoke.mjs
