name = "questbook"
main = "dist/server/index.js"
compatibility_date = "2025-04-01"
[[d1_databases]]
binding = "DB"
database_name = "questbook-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "questbook-files"
[vars]
LOCAL_DEV = "true"
